name: iPhone IPA (unsigned, for AltStore / SideStore / Sideloadly)
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: python3 scripts/build.py
      - run: npx cap sync ios
      - name: Build without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr golem-basecamp.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: golem-basecamp-ios, path: golem-basecamp.ipa }
